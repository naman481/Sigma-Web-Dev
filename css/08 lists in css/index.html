<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>syling in list</title>
    <style>
        nav ul li {
            list-style: upper-alpha;
            background-color: yellow;
            list-style-position: inside;
            border: 2px solid black;
            /* list-style-image: https://unsplash.com/photos/dirt-road-through-autumnal-forest-fFE6UNRjqzA; */
       /* list-style: disc inside url(https://unsplash.com/photos/dirt-road-through-autumnal-forest-fFE6UNRjqzA);
       */
        list-style-type: style type emoji;;}
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>

</body>

</html>

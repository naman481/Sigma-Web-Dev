 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS variables</title>
    <style>
        :root{
            --primary-color: #0077ff;
            --secondary-color: #e0f2ff;
            --nav-bg: rgb(29, 179, 54);
            --def-padding: 34px;
        }

        *{
            margin: 0;
            padding: 0;
        }

        .nav{
            background-color: var(--nav-bg);
            background-color: var(--primary-color);
        }

        ul{
            display: flex;
        }

        ul li{
            list-style: none;
            padding: var(--def-padding);
            color: white;
            font-family: sans-serif;
        }

        .container{
            padding: 20px;
            margin: 20px;
            background-color: var(--secondary-color);
            border: 2px solid var(--primary-color);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>

    <div class="container">
        <p>This is using CSS Variables. Agar main :root me --primary-color change kar du to sab jagah color change ho jayega.</p>
    </div>
</body>
</html>

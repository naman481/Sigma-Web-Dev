<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css POsition</title>
    <style>
        *{padding: 0;
        margin: 0;
    }
    .box1{
        background-color: aquamarine;
        position:sticky;
        top: 0px;
        left: 3px;
    }
    .box2{
        background-color: blueviolet;
        position: relative;
        top: 34px;
        left: 56px;
    }
    .box3{
        background-color: azure;
        position: fixed;
        bottom: 0px;
        left: 8vw;
        height: 111px;

    }
    .box4{
        background-color: purple;
    }
     
.box{
    height: 133px;
    width: 80vw;
    padding: 3px;
    margin: 3px;
    border: 2px solid black;
}
.parent{
    padding: 43px;
    margin: 34px;
    border: 2px solid black;
    /* position: relative; */
    /* transform: translate(0); */
    /* transform, filter, or perspective properties can also
    make an element appear as positioned */
    /* filter: invert(0); */
    perspective: 0em;
}
    </style>
</head>

<body>
    <div class="parent">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
</div></body>

</html>

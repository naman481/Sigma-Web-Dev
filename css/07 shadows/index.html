<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px greenyellow;
            text-shadow: 7px 15px 7px red;


        }
        .text-shadow{
            text-shadow: 7px 15px 7px red;
        }
    </style>

</head>

<body>
    <div class="box">
        I am a box.

    </div>
    <div class="text-shadow">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Dicta possimus fugit, dolorem et quae eaque veritatis,
        minus nobis fuga veniam excepturi reprehenderit quasi?
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

            <span>Lake</span>
        </div>

        <div class="content">
            <h2>Lago di Braies</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quas, provident. Consectetur officiis repellat sint suscipit.</p>
        </div>

        <div class="button-container">
            <button>Read More</button>
        </div>
    </div>
</body>
</html>

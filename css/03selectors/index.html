<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <style>
        /*Element Selector*/

        /*class selector*/
        .red {
            background-color: red;
        }

        /*id selector*/
        #green {
            background-color: green;
        }

        /* Child selectors */
        div>p {
            color: blue;
            background-color: brown;
        }

        /* Descendent Selector */
        div p {
            color: blue;
            background-color: brown;
        }

        /* Universal selector */
        * {
            margin: 0;
            padding: 0;

        }

        /* pseudo selector */
        a:visited {
            color: yellow;
        }

        a:link {
            color: green;
        }

        a:active {
            background-color: red;
        }
        a:hover{
            background-color: yellow;
        }
        p:first-child{
            background-color: aqua ;
        }

    </style>
</head>

<body>
    <main class="One">
        <p>I am First</p>
        <p>I am second

        </p>
    </main>
    <div class="selector">
        I am One
        

    </div>
    <div class="red">
        <p>
        <article>

            I am a paragrapgh
        </article>
        </p>
        My Name is Naman
    </div>
    <div id="green">
        hello

    </div>
    <a href="https://www.google.com">Go to google</a>
    <a href="https://www.facebook.com">Go to facebook</a>
</body>

</html>

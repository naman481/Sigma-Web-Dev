
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 25px;
        }

        .container {
            margin: 40px auto;
            padding: 25px;
            max-width: 500px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px #00000015;
        }

        h2 {
            color: #333;
        }

        .link {
            display: block;
            margin: 15px auto;
            padding: 12px;
            max-width: 250px;
            color: white;
            background-color: #2563eb;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s;
        }

        .link:hover {
            background-color: #1e40af;
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Your favorite websites in one place!</p>
    </header>

    <div class="container">
        <h2>Useful Links</h2>

        <a class="link" href="https://www.google.com"
           target="_blank" rel="noopener noreferrer">
            Google
        </a>

        <a class="link" href="https://www.facebook.com"
           target="_blank" rel="noopener noreferrer">
            Facebook
        </a>

        <a class="link" href="https://www.youtube.com"
           target="_blank" rel="noopener noreferrer">
            YouTube
        </a>

        <a class="link" href="https://www.instagram.com"
           target="_blank" rel="noopener noreferrer">
            Instagram
        </a>

        <a class="link" href="https://www.wikipedia.org"
           target="_blank" rel="noopener noreferrer">
            Wikipedia
        </a>
    </div>

    <footer>
        <p>&copy; 2026 My First Website</p>
    </footer>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        #clock {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background-color: #111827;
            color: #4ade80;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 4px 10px #00000030;
        }

        .container {
            margin: 40px auto;
            padding: 25px;
            max-width: 500px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px #00000015;
        }

        h2 {
            color: #333;
        }

        .link {
            display: block;
            margin: 15px auto;
            padding: 12px;
            max-width: 250px;
            color: white;
            background-color: #2563eb;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .link:hover {
            background-color: #1e40af;
            transform: scale(1.03);
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Your favorite websites in one place!</p>

        <div id="clock">00:00:00</div>
        <p id="date"></p>
    </header>

    <div class="container">
        <h2>Useful Links</h2>

        <a class="link" href="https://www.google.com"
           target="_blank" rel="noopener noreferrer">Google</a>

        <a class="link" href="https://www.facebook.com"
           target="_blank" rel="noopener noreferrer">Facebook</a>

        <a class="link" href="https://www.youtube.com"
           target="_blank" rel="noopener noreferrer">YouTube</a>

        <a class="link" href="https://www.instagram.com"
           target="_blank" rel="noopener noreferrer">Instagram</a>

        <a class="link" href="https://www.wikipedia.org"
           target="_blank" rel="noopener noreferrer">Wikipedia</a>
    </div>

    <footer>
        <p>&copy; 2026 My First Website</p>
    </footer>

    <script>
        function updateClock() {
            const now = new Date();

            document.getElementById("clock").textContent =
                now.toLocaleTimeString("en-IN", {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                });

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-IN", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>

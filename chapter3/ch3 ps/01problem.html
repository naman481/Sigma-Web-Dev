<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>food at your door</title>
    <style>
        
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #fff8f0;
    color: #282c3f;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 8%;
    background-color: #ffffff;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
}

/* Logo */
header div:first-child {
    font-size: 30px;
    font-weight: bold;
    color: #fc8019;
    letter-spacing: 1px;
}

/* Navigation */
nav {
    display: flex;
    gap: 32px;
}

nav a {
    text-decoration: none;
    color: #282c3f;
    font-size: 16px;
    font-weight: 600;
    transition: color 0.3s ease;
}

nav a:hover {
    color: #fc8019;
}

/* Main Section */
main {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(
        135deg,
        #fff3e6,
        #ffe0c2,
        #fff8f0
    );
}

/* Main Heading */
main div {
    font-size: clamp(36px, 5vw, 58px);
    font-weight: 800;
    color: #fc8019;
    max-width: 800px;
    line-height: 1.2;
    margin-bottom: 24px;
}

/* Description */
main p {
    font-size: 19px;
    line-height: 1.7;
    color: #686b78;
    max-width: 600px;
}

/* Responsive Design */
@media (max-width: 600px) {
    header {
        padding: 20px;
        flex-direction: column;
        gap: 20px;
    }

    nav {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
    }

    nav a {
        font-size: 14px;
    }

    main {
        min-height: 70vh;
        padding: 40px 20px;
    }

    main p {
        font-size: 16px;
    }
}

    </style>
</head>
<body>
    <header>
        <div>swiggy</div>
        <div>
        <a href="/home">Home</a>
        <a href="/about">about Us</a>
        <a href="/contact">contact</a>
        </div>
    </header>
    <main>
        <div>
            Order food From Anywhwere
        </div>
        <p>
            Order food & groceries. Discover best restaurants. Swiggy it!
        </p>
    </main>
</body>
</html>
